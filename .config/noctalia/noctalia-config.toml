[plugins]
enabled = [ "noctalia/bongocat", "8bury/mini-docker", "h465855hgg/lyrics", "noctalia/timer", "thepunkoff/pomodoro" ]

[shell]
corner_radius_scale = 0.60000000894069672
font_family = "Noto Sans Mono"
settings_window_translucent = true

    [shell.animation]
    speed = 4.0

    [shell.launcher]
    compact = true
    pinned = [ "firefox", "steam", "vesktop" ]

        [shell.launcher.providers.emoji]
        prefix = ""

    [shell.panel]
    open_near_click_launcher = true
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"

[theme]
builtin = "Gruvbox"
community_palette = "Catppuccin Mocha Mauve-Lavender"
mode = "dark"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "qt" ]
    community_ids = [ "libreoffice", "obsidian", "vscode", "prismlauncher", "steam", "rofi", "fastfetch", "obs" ]

[wallpaper]
edge_smoothness = 0.0
fill_color = "tertiary"
fill_mode = "fit"
transition = [ "wipe" ]
transition_duration = 300
transition_on_startup = true

    [wallpaper.automation]
    recursive = false

